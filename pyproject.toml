[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ckanext-publications-qld-theme"
version = "2.1.1"
description = "Custom extension for Publications QLD"
requires-python = ">=3.7"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
]
keywords = ["CKAN"]

dependencies = [
    "ckanext-csrf-filter>=2.0.3",
    "ckanext-qgov>=7.4.6",
    "ckanext-resource-type-validation>=1.0.16",
    "ckanext-ssm-config>=0.1.2",
]

authors = [
    {name = "Queensland Government and Salsa Digital"},
]

[project.license]
text = "AGPL"

[project.urls]
Homepage = "https://github.com/qld-gov-au/ckanext-publications-qld-theme"

[project.optional-dependencies]
dev = [
    "beautifulsoup4==4.9.1",
    "Appium-Python-Client==2.10.1",
    "behaving==3.3.*",
    "ckanapi>=4.7",
    "ckantoolkit>=0.0.4",
    "factory-boy",
    "flake8==7.3.*",
    "mock",
    "pytest-ckan",
    "requests>=2.32.0",
    "selenium<4.10",
    "six>=1.13.0",
    "urllib3>=2.2.2",
    "zipp>=3.19.1"
]

[project.entry-points."ckan.plugins"]
publications_qld_theme = "ckanext.publications_qld_theme.plugin:PublicationsQldThemePlugin"

[project.entry-points."babel.extractors"]
ckan = "ckan.lib.extract:extract_ckan"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = ["contrib*", "docs*", "tests*"]

[tool.setuptools.package-data]
 "ckanext.publications_qld_theme" = ["assets/*", "public/*", "public/assets/*"]

[tool.pytest.ini_options]
addopts = "--ckan-ini test.ini"

[tool.babel]
# Babel message extraction configuration
# Equivalent to the previous setup.py message_extractors.
message-extractors = [
    "ckanext/**/*.py:python",
    "ckanext/**/*.js:javascript",
    "ckanext/**/templates/**/*.html:ckan",
]

[tool.babel.extract_messages]
keywords = ["translate", "isPlural"]
add_comments = ["TRANSLATORS:"]
output_file = "ckanext/publications_qld_theme/i18n/ckanext-publications-qld-theme.pot"
width = 80

[tool.babel.init_catalog]
domain = "ckanext-publications-qld-theme"
input_file = "ckanext/publications_qld_theme/i18n/ckanext-publications-qld-theme.pot"
output_dir = "ckanext/publications_qld_theme/i18n"

[tool.babel.update_catalog]
domain = "ckanext-publications-qld-theme"
input_file = "ckanext/publications_qld_theme/i18n/ckanext-publications-qld-theme.pot"
output_dir = "ckanext/publications_qld_theme/i18n"
previous = true

[tool.babel.compile_catalog]
domain = "ckanext-publications-qld-theme"
directory = "ckanext/publications_qld_theme/i18n"
statistics = true